<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codes.Tn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0B1120;
  --bg-soft:#0E1626;
  --surface:#131B2E;
  --surface-2:#1A2338;
  --surface-3:#212C46;
  --border:#232C42;
  --accent:#4CC9C0;
  --accent-dim:#2E5E5A;
  --accent-2:#F2B84B;
  --text:#E8ECF4;
  --text-muted:#8B95AC;
  --text-faint:#5B6789;
  --danger:#E5605A;
  --radius:10px;
  --mono:'JetBrains Mono', monospace;
  --display:'Space Grotesk', sans-serif;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;}
a{color:var(--accent);text-decoration:none;}
::selection{background:var(--accent);color:#04231f;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-soft);}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.hidden{display:none !important;}

/* ---------- Loading ---------- */
.boot{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
.boot-logo{font-family:var(--mono);font-size:15px;color:var(--accent);letter-spacing:.5px;}
.boot-bar{width:220px;height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
.boot-bar::after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:load 1.1s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-100%);}100%{transform:translateX(340%);}}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 15% 20%, rgba(76,201,192,.10), transparent 40%),
  radial-gradient(circle at 85% 80%, rgba(242,184,75,.08), transparent 40%),
  var(--bg);}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
.auth-head{padding:28px 28px 0 28px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#2f8f88);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:#04231f;font-size:15px;}
.brand-name{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;}
.brand-name span{color:var(--accent);}
.auth-sub{color:var(--text-muted);font-size:13.5px;margin:2px 0 20px;font-family:var(--mono);}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 28px;}
.tab-btn{flex:1;padding:12px 4px;background:none;border:none;color:var(--text-muted);font-size:14px;font-weight:600;border-bottom:2px solid transparent;transition:.15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.auth-body{padding:24px 28px 28px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-family:var(--mono);}
.field input,.field select{width:100%;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;transition:.15s;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;transition:.15s;}
.btn-primary{background:var(--accent);color:#04231f;width:100%;}
.btn-primary:hover{background:#5fd8cf;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-danger:hover{background:rgba(229,96,90,.1);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:6px;}
.auth-error{background:rgba(229,96,90,.1);border:1px solid rgba(229,96,90,.4);color:#ff9d98;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.auth-note{margin-top:16px;font-size:12px;color:var(--text-faint);line-height:1.6;font-family:var(--mono);}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:74px;background:var(--bg-soft);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;flex-shrink:0;}
.side-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#2f8f88);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:#04231f;font-size:15px;margin-bottom:18px;}
.side-btn{width:46px;height:46px;border:none;background:transparent;border-radius:10px;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:19px;position:relative;transition:.15s;}
.side-btn:hover{background:var(--surface-2);color:var(--text);}
.side-btn.active{background:var(--surface-2);color:var(--accent);}
.side-btn.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:2px;}
.side-btn .tip{position:absolute;left:58px;background:var(--surface-3);color:var(--text);font-size:11.5px;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-family:var(--body);z-index:50;border:1px solid var(--border);}
.side-btn:hover .tip{opacity:1;}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabbar{height:44px;background:var(--bg-soft);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 6px;flex-shrink:0;overflow-x:auto;}
.tabbar .dot{width:11px;height:11px;border-radius:50%;margin:0 5px;}
.tabbar .dot.r{background:#5f5750;}
.tabbar .dot.y{background:#5f5730;}
.tabbar .dot.g{background:#2f5f4a;}
.file-tab{display:flex;align-items:center;gap:8px;padding:0 16px;height:44px;font-family:var(--mono);font-size:12.5px;color:var(--text-muted);border-right:1px solid var(--border);background:var(--surface);border-bottom:2px solid var(--accent);}
.content{flex:1;overflow-y:auto;padding:32px 36px 60px;}
@media (max-width:720px){.content{padding:20px 16px 50px;}}

.page-title{font-family:var(--display);font-size:26px;font-weight:700;margin:0 0 4px;}
.page-title .pfx{color:var(--accent);font-family:var(--mono);font-weight:500;}
.page-sub{color:var(--text-muted);font-size:14px;margin:0 0 28px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-num{font-family:var(--display);font-size:28px;font-weight:700;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}

/* subject file-tab cards */
.subject-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;transition:.15s;cursor:pointer;position:relative;overflow:hidden;}
.subject-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.subject-card .ext{font-family:var(--mono);color:var(--accent-2);font-size:12px;position:absolute;top:14px;right:16px;}
.subject-card .sname{font-family:var(--display);font-weight:600;font-size:16.5px;margin-top:6px;}
.subject-card .scount{font-size:12px;color:var(--text-muted);margin-top:6px;font-family:var(--mono);}
.subject-card .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent-dim);}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-family:var(--mono);margin-bottom:18px;background:none;border:none;}
.back-link:hover{color:var(--accent);}

.lesson-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;margin-bottom:10px;}
.lesson-row .li-title{font-weight:600;font-size:14px;}
.lesson-row .li-meta{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);margin-top:3px;}
.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-family:var(--mono);font-size:13px;border:1px dashed var(--border);border-radius:12px;}

/* schedule */
.sched-toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.sched-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 40px -28px rgba(0,0,0,.6);}
#schedule-table{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;background:var(--surface);}
#schedule-table th,#schedule-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;text-align:center;}
#schedule-table th:last-child, #schedule-table td:last-child{border-right:none;}
#schedule-table th{background:var(--surface-2);font-family:var(--mono);font-size:12px;color:var(--accent);padding:13px 6px;font-weight:600;position:sticky;top:0;z-index:2;}
#schedule-table th:first-child{border-top-left-radius:14px;}
#schedule-table th:last-child{border-top-right-radius:14px;}
#schedule-table td.timecell{background:var(--surface-2);font-family:var(--mono);font-size:11px;color:var(--text-faint);padding:8px 6px;white-space:nowrap;}
#schedule-table tbody tr:nth-child(even) td:not(.timecell){background:rgba(255,255,255,.012);}
#schedule-table tbody tr:hover td:not(.timecell){background:rgba(76,201,192,.045);}
#schedule-table input{width:100%;height:46px;border:none;background:transparent;color:var(--text);text-align:center;font-size:12.5px;padding:4px;transition:background .15s;}
#schedule-table input:focus{background:var(--surface-3) !important;}

.sched-progress-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sched-progress-track{flex:1;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;max-width:280px;}
.sched-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .4s cubic-bezier(.2,.7,.3,1);}
.sched-progress-label{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);}

/* profile */
.profile-head{display:flex;align-items:center;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);overflow:hidden;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.role-badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(76,201,192,.12);color:var(--accent);border:1px solid var(--accent-dim);margin-top:6px;}
.role-badge.admin{background:rgba(242,184,75,.12);color:var(--accent-2);border-color:#6b5527;}

/* about */
.about-hero{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;margin-bottom:30px;}
.about-photo{width:150px;height:150px;border-radius:14px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
.about-text{max-width:560px;line-height:1.75;color:var(--text);font-size:15px;}
.contact-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
.contact-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);padding:9px 14px;border-radius:9px;font-size:13px;transition:.15s;color:var(--text);}
.contact-chip:hover{border-color:var(--accent);color:var(--accent);}
.contact-chip svg{width:17px;height:17px;flex-shrink:0;}

/* admin table */
table.data{width:100%;border-collapse:collapse;}
table.data th{text-align:left;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;}
table.data td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13.5px;}
table.data tr:hover td{background:var(--surface-2);}
.admin-tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--border);}
.admin-tab{padding:9px 4px;margin-right:18px;background:none;border:none;color:var(--text-muted);font-size:14px;font-weight:600;border-bottom:2px solid transparent;}
.admin-tab.active{color:var(--accent-2);border-bottom-color:var(--accent-2);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,8,16,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:24px;}
.modal h3{font-family:var(--display);margin:0 0 18px;font-size:18px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--accent);color:var(--text);padding:11px 20px;border-radius:9px;font-size:13.5px;z-index:200;font-family:var(--mono);box-shadow:0 10px 30px rgba(0,0,0,.4);}

.hint{font-size:12px;color:var(--text-faint);margin-top:4px;font-family:var(--mono);}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{padding:6px 12px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-muted);cursor:pointer;transition:.15s;}
.pill:hover{border-color:var(--accent);color:var(--text);}
.pill.active{background:rgba(76,201,192,.12);border-color:var(--accent);color:var(--accent);}

.radio-row{display:flex;gap:16px;margin-bottom:12px;}
.radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);}

/* ---------- Decorative flourishes ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes blink{0%,55%{opacity:1;}56%,100%{opacity:0;}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(76,201,192,.35);}50%{box-shadow:0 0 0 6px rgba(76,201,192,0);}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes shimmerMove{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@keyframes spinSlow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}

.anim-in{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
.grid > *{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
.grid > *:nth-child(1){animation-delay:.02s;}
.grid > *:nth-child(2){animation-delay:.08s;}
.grid > *:nth-child(3){animation-delay:.14s;}
.grid > *:nth-child(4){animation-delay:.20s;}
.grid > *:nth-child(5){animation-delay:.26s;}
.grid > *:nth-child(6){animation-delay:.32s;}
.grid > *:nth-child(7){animation-delay:.38s;}
.grid > *:nth-child(8){animation-delay:.44s;}
.page-title, .page-sub, .card{animation:fadeInUp .45s cubic-bezier(.2,.7,.3,1) both;}

.brand-mark, .side-logo{position:relative;animation:floaty 3.4s ease-in-out infinite;}
.brand-mark::after, .side-logo::after{content:'';position:absolute;inset:-3px;border-radius:11px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 100%;opacity:.55;filter:blur(7px);z-index:-1;animation:shimmerMove 3s linear infinite;}

.cursor-blink{display:inline-block;width:8px;height:1em;background:var(--accent);margin-left:3px;vertical-align:-2px;animation:blink 1s step-end infinite;}

.subject-card{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
.subject-card .semoji{font-size:22px;line-height:1;margin-bottom:2px;display:inline-block;transition:transform .25s;}
.subject-card:hover .semoji{transform:scale(1.18) rotate(-6deg);}
.subject-card:hover{box-shadow:0 14px 30px -12px var(--scolor, rgba(76,201,192,.5));border-color:var(--scolor, var(--accent));}
.subject-card .ext{color:var(--scolor, var(--accent-2));}
.subject-card .bar{background:linear-gradient(90deg, transparent, var(--scolor, var(--accent)), transparent);background-size:300% 100%;opacity:0;transition:opacity .25s;animation:shimmerMove 4s linear infinite;}
.subject-card:hover .bar{opacity:1;}
.subject-card .scount{display:inline-flex;align-items:center;gap:5px;}
.subject-card .scount::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--scolor, var(--accent));display:inline-block;}

.code-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.code-particles span{position:absolute;font-family:var(--mono);color:var(--accent);opacity:.10;animation:floaty 5s ease-in-out infinite;}
.hero-body > *:not(.code-particles){position:relative;z-index:1;}

.stat{animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;transition:transform .2s, box-shadow .2s;position:relative;}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(76,201,192,.3);}
.stat-icon{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb, var(--icolor, var(--accent)) 16%, transparent);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;}

.quick-card{position:relative;overflow:hidden;transition:.2s;}
.quick-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qcolor, var(--accent));}
.quick-card:hover{transform:translateY(-3px);border-color:var(--qcolor, var(--accent));box-shadow:0 14px 28px -14px var(--qcolor, rgba(76,201,192,.4));}
.quick-card:hover .qc-emoji{display:inline-block;animation:floaty 1s ease-in-out infinite;}
.qc-top{display:flex;align-items:center;justify-content:space-between;}
.qc-num{font-family:var(--mono);color:var(--text-faint);font-size:12px;}
.qc-arrow{font-family:var(--mono);color:var(--qcolor, var(--accent));opacity:0;transform:translateX(-4px);transition:.2s;}
.quick-card:hover .qc-arrow{opacity:1;transform:translateX(0);}

.next-session-card{--ncolor:#4CC9C0;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ncolor);border-radius:12px;padding:14px 18px;animation:fadeInUp .5s cubic-bezier(.2,.7,.3,1) both;}
.ns-dot{width:10px;height:10px;border-radius:50%;background:var(--ncolor);flex-shrink:0;}
.ns-dot.pulse{animation:pulseGlow 1.6s ease-in-out infinite;}
.ns-label{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.ns-title{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ncolor);margin-top:2px;}
.ns-time{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:2px;}

.side-logo{animation:floaty 3.4s ease-in-out infinite, pulseGlow 2.6s ease-in-out infinite;}

.ring-wrap{position:relative;width:96px;height:96px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);width:96px;height:96px;}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:8;}
.ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1);}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--display);}
.ring-label b{font-size:19px;}
.ring-label span{font-size:9.5px;color:var(--text-muted);font-family:var(--mono);}

.hero-card{background:linear-gradient(135deg, rgba(76,201,192,.10), rgba(242,184,75,.06)), var(--surface);border:1px solid var(--border);border-radius:14px;padding:0;display:block;position:relative;overflow:hidden;margin-bottom:18px;}
.hero-card::before{content:'</>';position:absolute;right:18px;top:44px;font-family:var(--mono);font-size:64px;font-weight:700;color:rgba(76,201,192,.06);}
.hero-winbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.12);}
.hero-winbar .dot{width:9px;height:9px;border-radius:50%;}
.hero-winbar .dot.r{background:#e5605a;opacity:.6;}
.hero-winbar .dot.y{background:#f2b84b;opacity:.6;}
.hero-winbar .dot.g{background:#4cc9c0;opacity:.6;}
.hero-winpath{margin-left:10px;font-family:var(--mono);font-size:11px;color:var(--text-faint);}
.hero-body{padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;}
.hero-badge{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:rgba(242,184,75,.1);border:1px solid #6b5527;padding:3px 10px;border-radius:20px;display:inline-block;animation:popIn .4s ease both;}

.avatar{transition:.2s;}
.avatar:hover{transform:scale(1.05);border-color:var(--accent);}
.avatar-lg{width:56px;height:56px;font-size:22px;flex-shrink:0;}
.accueil-header{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
.role-badge{animation:popIn .35s ease both;}
.role-badge.admin::before{content:'✦ ';}

.subject-detail-icon{display:inline-block;animation:floaty 2.6s ease-in-out infinite;margin-right:2px;}

.contact-chip{position:relative;overflow:hidden;}
.contact-chip:hover svg{animation:floaty 1.2s ease-in-out infinite;}

.about-photo{transition:.25s;}
.about-photo:hover{transform:rotate(-1.5deg) scale(1.02);box-shadow:0 16px 34px -16px rgba(76,201,192,.4);}

.btn-primary{position:relative;overflow:hidden;}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%);transition:none;}
.btn-primary:active::after{animation:sweep .5s ease;}
@keyframes sweep{to{transform:translateX(120%);}}

.toast{animation:popIn .3s ease both;}

/* ---------- Chat ---------- */
.chat-shell{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:var(--surface);height:min(620px, 70vh);overflow:hidden;}
.chat-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-shrink:0;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg-row{display:flex;gap:10px;max-width:80%;animation:fadeInUp .3s ease both;}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse;}
.msg-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12.5px;font-weight:700;color:var(--accent);flex-shrink:0;}
.msg-bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:9px 13px;}
.msg-row.me .msg-bubble{background:rgba(76,201,192,.12);border-color:var(--accent-dim);}
.msg-meta{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.msg-text{font-size:14px;line-height:1.5;word-break:break-word;}
.chat-input-row{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.chat-input-row input{flex:1;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px;}
.chat-input-row input:focus{border-color:var(--accent);}
.chat-closed-banner{font-size:12.5px;color:var(--accent-2);font-family:var(--mono);text-align:center;padding:6px;}

/* ---------- Emploi extras ---------- */
.legend-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.legend-chip{--scolor:var(--accent);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:20px;background:color-mix(in srgb, var(--scolor) 15%, transparent);border:1px solid var(--scolor);color:var(--scolor);font-family:var(--mono);}
#schedule-table th.today-col{color:var(--accent);position:relative;}
#schedule-table td.today-col{background:rgba(76,201,192,.05);}
#schedule-table td.today-col:first-child{background:transparent;}
</style>

    });
  });

/* ================= FIRESTORE HELPERS ================= */
async function getUser(username){
  try{
    const doc = await db.collection('users').doc(username.toLowerCase()).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function saveUser(user){
  try{ await db.collection('users').doc(user.username.toLowerCase()).set(user, {merge:true}); }
  catch(e){ console.error('saveUser failed', e); toast("Erreur d'enregistrement."); }
}
async function deleteUser(username){
  try{ await db.collection('users').doc(username.toLowerCase()).delete(); }
  catch(e){ console.error(e); }
  const members = await getChatMembers();
  if(members.includes(username.toLowerCase())){
    await saveChatMembers(members.filter(u => u !== username.toLowerCase()));
  }
  /* NOTE : ceci supprime le PROFIL de l'élève (il sera automatiquement déconnecté
     et ne pourra plus utiliser l'app). Le compte d'authentification Firebase sous-jacent
     reste techniquement présent — pour le supprimer totalement, va dans
     Firebase Console → Authentication et supprime-le manuellement (le SDK client ne
     permet pas à un admin de supprimer le compte Auth d'un AUTRE utilisateur). */
}
async function getAllUsers(){
  try{
    const snap = await db.collection('users').get();
    return snap.docs.map(d=>d.data());
  }catch(e){ console.error(e); return []; }
}
async function getIndex(){
  const users = await getAllUsers();
  return users.map(u=>u.username);
}
async function saveIndex(){ /* no-op : la collection Firestore fait office d'index */ }

async function getPdfs(subjectId){
  try{
    const snap = await db.collection('pdfs').doc(subjectId).collection('items').orderBy('addedAt','desc').get();
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); return []; }
}
async function addPdfItem(subjectId, item){
  try{ await db.collection('pdfs').doc(subjectId).collection('items').doc(item.id).set(item); }
  catch(e){ console.error(e); toast("Erreur : fichier peut-être trop volumineux (max ~700 Ko)."); }
}
async function deletePdfItem(subjectId, itemId){
  try{ await db.collection('pdfs').doc(subjectId).collection('items').doc(itemId).delete(); }
  catch(e){ console.error(e); }
}

async function getExams(subjectId){
  try{
    const snap = await db.collection('exams').doc(subjectId).collection('items').get();
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); return []; }
}
async function addExamItem(subjectId, item){
  try{ await db.collection('exams').doc(subjectId).collection('items').doc(item.id).set(item); }
  catch(e){ console.error(e); toast('Erreur.'); }
}
async function deleteExamItem(subjectId, itemId){
  try{ await db.collection('exams').doc(subjectId).collection('items').doc(itemId).delete(); }
  catch(e){ console.error(e); }
}

async function getChatMessages(){
  try{
    const snap = await db.collection('chat_messages').orderBy('at','asc').limitToLast(200).get();
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error(e); return []; }
}
async function addChatMessage(msg){
  try{ await db.collection('chat_messages').add(msg); }
  catch(e){ console.error(e); toast("Message non envoyé."); }
}
async function getChatMembers(){
  try{
    const doc = await db.collection('chat').doc('members').get();
    return doc.exists ? (doc.data().usernames||[]) : [];
  }catch(e){ return []; }
}
async function saveChatMembers(arr){
  try{ await db.collection('chat').doc('members').set({usernames:arr}); }
  catch(e){ console.error(e); }
}
async function getChatMeta(){
  try{
    const doc = await db.collection('chat').doc('meta').get();
    return doc.exists ? doc.data() : {closed:false};
  }catch(e){ return {closed:false}; }
}
async function saveChatMeta(meta){
  try{ await db.collection('chat').doc('meta').set(meta); }
  catch(e){ console.error(e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const holder = document.getElementById('toast-holder');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  holder.innerHTML = '';
  holder.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
}

/* ================= INIT / SEED ================= */
async function ensureAdminSeed(){
  const existing = await getUser(ADMIN_USERNAME);
  if(existing) return;
  try{
    await auth.createUserWithEmailAndPassword(usernameToEmail(ADMIN_USERNAME), ADMIN_DEFAULT_PASSWORD);
  }catch(e){
    if(e.code !== 'auth/email-already-in-use'){ console.error('admin seed failed', e); return; }
  }
  const admin = {
    username: ADMIN_USERNAME,
    fullname: 'Ismail Boubakri',
    phone: '58118061',
    role: 'admin',
    schedule: {},
    avatar: null,
    createdAt: Date.now()
  };
  await saveUser(admin);
  try{ await auth.signOut(); }catch(e){}
}

async function ensureExamsSeed(){
  const flagDoc = await db.collection('meta').doc('exams_seeded_v1').get().catch(()=>null);
  if(flagDoc && flagDoc.exists) return;
  const seedData = buildBacwebExams();
  for(const subjectId of Object.keys(seedData)){
    const existing = await getExams(subjectId);
    if(existing.length === 0){
      for(const item of seedData[subjectId]){
        await addExamItem(subjectId, item);
      }
    }
  }
  await db.collection('meta').doc('exams_seeded_v1').set({done:true}).catch(()=>{});
}

async function ensureChatSeed(){
  const doc = await db.collection('chat').doc('members').get().catch(()=>null);
  if(!doc || !doc.exists){
    const users = await getAllUsers();
    await saveChatMembers(users.map(u=>u.username));
  }
}

function boot(){
  render();
  ensureAdminSeed().then(()=>{ ensureExamsSeed(); ensureChatSeed(); });
  auth.onAuthStateChanged(async (fbUser)=>{
    if(fbUser){
      const username = emailToUsername(fbUser.email);
      const profile = await getUser(username);
      if(!profile){
        STATE.currentUser = null;
        if(STATE.booted){
          try{ await auth.signOut(); }catch(e){}
          STATE.authError = "Ce compte a été supprimé par l'administrateur.";
        }
      } else {
        STATE.currentUser = profile;
        STATE.page = 'accueil';
      }
    } else {
      STATE.currentUser = null;
    }
    STATE.booted = true;
    render();
  });
}

/* ================= AUTH ACTIONS ================= */
async function doLogin(username, password){
  username = (username||'').trim().toLowerCase();
  if(!username || !password){ STATE.authError = "Veuillez remplir tous les champs."; render(); return; }
  try{
    await auth.signInWithEmailAndPassword(usernameToEmail(username), password);
    STATE.authError = '';
    toast('Connexion réussie !');
    fireConfetti();
  }catch(e){
    STATE.authError = "Nom d'utilisateur ou mot de passe incorrect.";
    render();
  }
}
function fireConfetti(){
  if(typeof confetti !== 'function') return;
  confetti({
    particleCount: 90,
    spread: 75,
    startVelocity: 38,
    origin: { y: 0.35 },
    colors: ['#4CC9C0', '#F2B84B', '#E8ECF4']
  });
}

async function doRegister(data){
  const username = (data.username||'').trim().toLowerCase();
  if(!username || !data.password || !data.fullname){
    STATE.authError = "Veuillez remplir les champs obligatoires.";
    render(); return;
  }
  if(!/^[a-z0-9_.]{3,20}$/.test(username)){
    STATE.authError = "Le nom d'utilisateur doit contenir 3 à 20 caractères (lettres, chiffres, . ou _).";
    render(); return;
  }
  if(data.password.length < 6){
    STATE.authError = "Le mot de passe doit contenir au moins 6 caractères.";
    render(); return;
  }
  const existing = await getUser(username);
  if(existing){
    STATE.authError = "Ce nom d'utilisateur est déjà pris.";
    render(); return;
  }
  try{
    await auth.createUserWithEmailAndPassword(usernameToEmail(username), data.password);
  }catch(e){
    STATE.authError = e.code === 'auth/email-already-in-use'
      ? "Ce nom d'utilisateur est déjà pris."
      : "Erreur lors de la création du compte.";
    render(); return;
  }
  const user = {
    username,
    fullname: data.fullname.trim(),
    phone: (data.phone||'').trim(),
    role: 'student',
    schedule: {},
    avatar: null,
    createdAt: Date.now()
  };
  await saveUser(user);
  const members = await getChatMembers();
  if(!members.includes(username)){
    members.push(username);
    await saveChatMembers(members);
  }
  STATE.authError = '';
  toast('Compte créé. Bienvenue sur Codes.Tn !');
  fireConfetti();
}

async function doLogout(){
  STATE.scheduleDraft = null;
  try{ await auth.signOut(); }catch(e){}
}

function findNextSession(u){
  const todayIdx = (new Date().getDay() + 6) % 7;
  const todayName = DAYS[todayIdx];
  if(!todayName) return null;
  const sch = (u.schedule && u.schedule[todayName]) || {};
  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  for(let i=0;i<SLOTS.length;i++){
    const val = sch[i];
    if(!val) continue;
    const start = SLOTS[i].split('-')[0];
    const end = SLOTS[i].split('-')[1];
    if(nowStr <= end){
      return {slot:SLOTS[i], subject:val, isNow: nowStr>=start && nowStr<=end, day:todayName};
    }
  }
  return null;
}

        <div style="color:var(--text-muted);font-size:13px;margin-top:6px;">Rejoins la discussion avec tes camarades.</div>
      </div>
    </div>

  `;
}
function animateCount(el, target, duration){
  if(!el) return;
  const start = 0;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(start + (target-start)*eased);
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function countFilledSlots(sch){
  let c=0;
  DAYS.forEach(d=>{ SLOTS.forEach((s,i)=>{ if(sch[d] && sch[d][i]) c++; }); });
  return c;
}
async function bindAccueilEvents(){

  const goC = document.getElementById('go-chat');
  if(goC) goC.addEventListener('click', ()=>{ STATE.page='chat'; render(); });
  const nsPlan = document.getElementById('ns-plan-btn');
  if(nsPlan) nsPlan.addEventListener('click', ()=>{ STATE.page='emploi'; render(); });

  document.querySelectorAll('[data-count]').forEach(el=>{
    animateCount(el, parseInt(el.dataset.count, 10) || 0, 900);
  });
  const ring = document.getElementById('ring-fill');
  const ringPct = document.getElementById('ring-pct');
  if(ring){
    const u = STATE.currentUser;
    const filled = countFilledSlots(u.schedule||{});
    const total = DAYS.length * SLOTS.length;
    const pct = total ? Math.round((filled/total)*100) : 0;
    const circ = 2 * Math.PI * 40;
    requestAnimationFrame(()=>{ ring.style.strokeDashoffset = circ - (pct/100)*circ; });
    let p = 0;
    const t0 = performance.now();
    function stepPct(now){
      const prog = Math.min(1, (now-t0)/900);
      p = Math.round(pct * (1 - Math.pow(1-prog,3)));
      ringPct.textContent = p + '%';
      if(prog < 1) requestAnimationFrame(stepPct);
    }
    requestAnimationFrame(stepPct);
  }

  let total = 0;
  for(const s of SUBJECTS){ total += (await getPdfs(s.id)).length; }
  const el = document.getElementById('pdf-count-stat');
  if(el) animateCount(el, total, 900);
}

function subjectColorFor(text){
  if(!text) return null;
  const t = text.trim().toLowerCase();
  const s = SUBJECTS.find(x => x.name.toLowerCase() === t || x.name.toLowerCase().startsWith(t) && t.length>2);
  return s ? s.color : null;
}
function renderEmploi(){
  const u = STATE.currentUser;
  if(!STATE.scheduleDraft){
    STATE.scheduleDraft = JSON.parse(JSON.stringify(u.schedule||{}));
  }
  const sd = STATE.scheduleDraft;
  const todayIdx = (new Date().getDay() + 6) % 7; // Monday=0 ... Sunday=6
  const todayName = DAYS[todayIdx]; // undefined for Sunday(idx6) since DAYS has 6 entries (Lun-Sam)
  const filled = countFilledSlots(sd);
  const total = DAYS.length * SLOTS.length;
  const pct = total ? Math.round((filled/total)*100) : 0;
  return `
    <h1 class="page-title"><span class="pfx">&gt;</span> Emploi du temps</h1>
    <p class="page-sub">// planifie ta semaine de révision, matière par créneau</p>

      <div class="sched-progress-track"><div class="sched-progress-fill" style="width:${pct}%;"></div></div>
      <span class="sched-progress-label">${pct}% rempli</span>
    </div>

      <button class="btn btn-primary btn-sm" id="save-sched">💾 Enregistrer</button>
      <button class="btn btn-ghost btn-sm" id="download-sched">⭳ Télécharger en image</button>

    </div>
    <div class="legend-row">
      ${SUBJECTS.map(s=>`<span class="legend-chip" style="--scolor:${s.color};">${s.emoji} ${escapeHtml(s.name)}</span>`).join('')}
    </div>
    <div class="sched-wrap">
      <table id="schedule-table">
        <thead><tr><th>Horaire</th>${DAYS.map(d=>`<th class="${d===todayName?'today-col':''}">${d}${d===todayName?' <span style=\"color:var(--accent);\">●</span>':''}</th>`).join('')}</tr></thead>
        <tbody>
          ${SLOTS.map((slot,i)=>`
            <tr>
              <td class="timecell">${slot}</td>
              ${DAYS.map(d=>{
                const val = (sd[d]&&sd[d][i])||'';
                const col = subjectColorFor(val);
                return `<td class="${d===todayName?'today-col':''}"><input list="subj-list" data-day="${escapeHtml(d)}" data-idx="${i}" value="${escapeHtml(val)}" style="${col? `background:${col}22;color:${col};font-weight:600;` : ''}"></td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

      ${SUBJECTS.map(s=>`<option value="${escapeHtml(s.name)}">`).join('')}
    </datalist>
    <p class="hint" style="margin-top:14px;">Astuce : commence à taper le nom d'une matière pour la suggestion automatique — la case se colore toute seule. ${todayName ? `Aujourd'hui : <span style="color:var(--accent);">${todayName}</span>.` : ''}</p>
  `;
}
function bindEmploiEvents(){
  document.querySelectorAll('#schedule-table input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const day = inp.dataset.day, idx = inp.dataset.idx;
      if(!STATE.scheduleDraft[day]) STATE.scheduleDraft[day] = {};
      STATE.scheduleDraft[day][idx] = inp.value;
      const col = subjectColorFor(inp.value);

      else { inp.style.background = ''; inp.style.color = ''; inp.style.fontWeight = ''; }

      const fillEl = document.querySelector('.sched-progress-fill');

    .onSnapshot(snap=>{

                <div class="li-title">${escapeHtml(usr.fullname)}</div>
                <div class="li-meta">@${escapeHtml(usr.username)}${usr.role==='admin' ? ' · admin' : ''}</div>
              </div>
              ${usr.role==='admin' ? `<span class="hint">toujours membre</span>` :
                `<button class="btn ${inChat?'btn-danger':'btn-ghost'} btn-sm" data-toggle-member="${usr.username}">${inChat ? 'Retirer' : 'Ajouter'}</button>`}
            </div>`;
          }).join('')}
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" id="chat-modal-close">Fermer</button></div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
    document.getElementById('chat-modal-close').addEventListener('click', ()=>overlay.remove());
    document.getElementById('chat-toggle-closed').addEventListener('click', async ()=>{
      const newMeta = {closed: !meta.closed};
      await saveChatMeta(newMeta);
      toast(newMeta.closed ? 'Discussion fermée.' : 'Discussion réouverte.');
      overlay.remove();
      render();
    });
    overlay.querySelectorAll('[data-toggle-member]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const username = btn.dataset.toggleMember;
        let list = await getChatMembers();
        if(list.includes(username)){
          list = list.filter(x=>x!==username);
          toast('Membre retiré.');
        } else {
          list.push(username);
          toast('Membre ajouté.');
        }
        await saveChatMembers(list);
        overlay.remove();
        render();
      });
    });
  });
}

function renderAdmin(){
  return `
    <h1 class="page-title"><span class="pfx">⚙</span> Administration</h1>
    <p class="page-sub">// gestion des élèves, des cours et des épreuves</p>
    <div class="admin-tabs">
      <button class="admin-tab ${STATE.adminTab==='eleves'?'active':''}" data-atab="eleves">Élèves</button>
      <button class="admin-tab ${STATE.adminTab==='cours'?'active':''}" data-atab="cours">Cours (PDF)</button>
      <button class="admin-tab ${STATE.adminTab==='examens'?'active':''}" data-atab="examens">Épreuves &amp; devoirs</button>
    </div>
    <div id="admin-body">
      ${STATE.adminTab==='eleves' ? `<div class="empty">Chargement…</div>` : (STATE.adminTab==='examens' ? renderAdminExamens() : renderAdminCours())}

        <div class="pill-select" id="ac-subject-pills">

        </div>
        <input type="hidden" id="ac-subject" value="${SUBJECTS[0].id}">

      <div class="field"><label>Titre du cours</label><input id="ac-title" placeholder="ex: Chapitre 3 - Les tableaux"></div>

        <label><input type="radio" name="ac-type" value="file" checked> Fichier PDF</label>
        <label><input type="radio" name="ac-type" value="link"> Lien externe</label>

}
function renderAdminExamens(){
  return `
    <div class="card" style="margin-bottom:24px;">
      <div style="font-family:var(--mono);color:var(--accent);font-size:12.5px;margin-bottom:14px;">// ajouter un sujet d'examen (فرض)</div>
      <div class="field"><label>Matière</label>
        <div class="pill-select" id="ae-subject-pills">
          ${SUBJECTS.map((s,i)=>`<button type="button" class="pill ${i===0?'active':''}" data-subject-pill="${s.id}">${s.emoji} ${escapeHtml(s.name)}</button>`).join('')}
        </div>
        <input type="hidden" id="ae-subject" value="${SUBJECTS[0].id}">
      </div>
      <div class="field"><label>Titre</label><input id="ae-title" placeholder="ex: Devoir de synthèse n°1"></div>
      <div class="field"><label>Année</label><input id="ae-year" type="number" placeholder="ex: 2024" min="2000" max="2100"></div>
      <div class="radio-row">
        <label><input type="radio" name="ae-session" value="principale" checked> Session principale</label>
        <label><input type="radio" name="ae-session" value="controle"> Session contrôle</label>
      </div>
      <div class="field"><label>Lien de l'énoncé *</label><input id="ae-enonce" placeholder="https://..."></div>
      <div class="field"><label>Lien du corrigé (si disponible)</label><input id="ae-corrige" placeholder="https://..."></div>
      <div class="hint" style="margin-bottom:12px;">Astuce : tu peux copier un lien direct depuis bacweb.tn ou héberger tes propres fichiers ailleurs (Google Drive, etc.) et coller le lien ici.</div>
      <button class="btn btn-primary btn-sm" id="ae-submit">Ajouter l'épreuve</button>
    </div>
    <div id="admin-exam-lists"></div>
  `;
}
async function bindAdminEvents(){
  document.querySelectorAll('.admin-tab').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.adminTab = b.dataset.atab; render(); });
  });
  if(STATE.adminTab==='eleves'){
    const users = await getAllUsers();
    const body = document.getElementById('admin-body');
    if(!body) return;
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="hint">${users.length} compte(s) — les élèves créent leur propre compte via « Inscription »</div>
      </div>
      <div class="card" style="overflow-x:auto;padding:0;">
        <table class="data">
          <thead><tr><th>Nom</th><th>Utilisateur</th><th>Téléphone</th><th>Rôle</th><th></th></tr></thead>
          <tbody>
            ${users.map(u=>`
              <tr>
                <td>${escapeHtml(u.fullname)}</td>
                <td style="font-family:var(--mono);">@${escapeHtml(u.username)}</td>
                <td>${escapeHtml(u.phone||'—')}</td>
                <td><span class="role-badge ${u.role==='admin'?'admin':''}">${u.role}</span></td>
                <td style="text-align:right;white-space:nowrap;">
                  <button class="btn btn-ghost btn-sm" data-edit="${u.username}">Modifier</button>
                  ${u.username!==STATE.currentUser.username ? `<button class="btn btn-danger btn-sm" data-del="${u.username}">Suppr.</button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', async ()=>{
      const u = await getUser(b.dataset.edit);
      openUserModal(u);
    }));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      if(confirm('Supprimer ce compte définitivement ?')){
        await deleteUser(b.dataset.del);
        toast('Compte supprimé.');
        render();
      }
    }));
  } else if(STATE.adminTab==='examens'){
    bindAdminExamensEvents();
  } else {
    bindAdminCoursEvents();
  }
}

function bindAdminExamensEvents(){
  bindSubjectPills('ae-subject-pills', 'ae-subject');
  document.getElementById('ae-submit').addEventListener('click', async ()=>{
    const subjectId = document.getElementById('ae-subject').value;
    const title = document.getElementById('ae-title').value.trim();
    const year = parseInt(document.getElementById('ae-year').value, 10) || null;
    const session = document.querySelector('input[name="ae-session"]:checked').value;
    const enonceUrl = document.getElementById('ae-enonce').value.trim();
    const corrigeUrl = document.getElementById('ae-corrige').value.trim();
    if(!title){ toast('Ajoute un titre.'); return; }
    if(!enonceUrl){ toast("Ajoute le lien de l'énoncé."); return; }
    await addExamItem(subjectId, {id:uid(), title, year, session, enonceUrl, corrigeUrl: corrigeUrl||null, addedAt:Date.now()});
    toast('Épreuve ajoutée.');
    document.getElementById('ae-title').value='';
    document.getElementById('ae-year').value='';
    document.getElementById('ae-enonce').value='';
    document.getElementById('ae-corrige').value='';
    renderAdminExamLists();
  });
  renderAdminExamLists();
}

async function renderAdminExamLists(){
  const holder = document.getElementById('admin-exam-lists');
  if(!holder) return;
  let html = '';
  for(const s of SUBJECTS){
    const list = (await getExams(s.id)).sort((a,b)=>(b.year||0)-(a.year||0));
    if(list.length===0) continue;
    html += `<div style="font-family:var(--mono);color:var(--accent-2);font-size:12px;margin:18px 0 8px;">${escapeHtml(s.name)}</div>`;
    html += list.map(item=>`
      <div class="lesson-row">
        <div>
          <div class="li-title">${escapeHtml(item.title)} ${item.year ? '· '+item.year : ''}</div>
          <div class="li-meta">session ${item.session==='controle'?'contrôle':'principale'} ${item.corrigeUrl ? '· avec corrigé' : '· sans corrigé'}</div>
        </div>
        <button class="btn btn-danger btn-sm" data-del-exam="${s.id}::${item.id}">Supprimer</button>
      </div>`).join('');
  }
  holder.innerHTML = html || `<div class="empty">Aucune épreuve ajoutée pour le moment.</div>`;
  holder.querySelectorAll('[data-del-exam]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [subjectId, itemId] = b.dataset.delExam.split('::');
      await deleteExamItem(subjectId, itemId);
      toast('Épreuve supprimée.');
      renderAdminExamLists();
    });
  });
}

function bindSubjectPills(containerId, hiddenInputId){
  const container = document.getElementById(containerId);
  if(!container) return;
  container.querySelectorAll('[data-subject-pill]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(hiddenInputId).value = btn.dataset.subjectPill;
    });
  });
}
function bindAdminCoursEvents(){
  bindSubjectPills('ac-subject-pills', 'ac-subject');
  document.querySelectorAll('input[name="ac-type"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      const isFile = document.querySelector('input[name="ac-type"]:checked').value === 'file';
      document.getElementById('ac-file-field').classList.toggle('hidden', !isFile);
      document.getElementById('ac-link-field').classList.toggle('hidden', isFile);
    });
  });
  document.getElementById('ac-submit').addEventListener('click', async ()=>{
    const subjectId = document.getElementById('ac-subject').value;
    const title = document.getElementById('ac-title').value.trim();
    const type = document.querySelector('input[name="ac-type"]:checked').value;
    if(!title){ toast('Ajoute un titre.'); return; }
    if(type === 'link'){
      const link = document.getElementById('ac-link').value.trim();
      if(!link){ toast("Ajoute un lien."); return; }
      await addPdfItem(subjectId, {id:uid(), title, type:'link', data:link, addedAt:Date.now()});
      toast('Cours ajouté.');
      renderAdminPdfLists();
      document.getElementById('ac-title').value='';
      document.getElementById('ac-link').value='';
    } else {
      const fileInput = document.getElementById('ac-file');
      const file = fileInput.files[0];
      if(!file){ toast('Choisis un fichier PDF.'); return; }
      if(file.size > 650*1024){ toast('Fichier trop volumineux (max ~650 Ko à cause de la limite Firestore). Utilise plutôt un lien externe (Google Drive, etc.) pour les gros fichiers.'); return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        await addPdfItem(subjectId, {id:uid(), title, type:'file', data:reader.result, addedAt:Date.now()});
        toast('Cours ajouté.');
        fileInput.value='';
        document.getElementById('ac-title').value='';
        renderAdminPdfLists();
      };
      reader.readAsDataURL(file);
    }
  });
  renderAdminPdfLists();
}

async function renderAdminPdfLists(){
  const holder = document.getElementById('admin-pdf-lists');
  if(!holder) return;
  let html = '';
  for(const s of SUBJECTS){
    const list = await getPdfs(s.id);
    if(list.length===0) continue;
    html += `<div style="font-family:var(--mono);color:var(--accent-2);font-size:12px;margin:18px 0 8px;">${escapeHtml(s.name)}</div>`;
    html += list.map(item=>`
      <div class="lesson-row">
        <div>
          <div class="li-title">${escapeHtml(item.title)}</div>
          <div class="li-meta">${item.type==='link'?'lien externe':'fichier PDF'}</div>
        </div>
        <button class="btn btn-danger btn-sm" data-del-pdf="${s.id}::${item.id}">Supprimer</button>
      </div>`).join('');
  }
  holder.innerHTML = html || `<div class="empty">Aucun cours ajouté pour le moment.</div>`;
  holder.querySelectorAll('[data-del-pdf]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [subjectId, itemId] = b.dataset.delPdf.split('::');
      await deletePdfItem(subjectId, itemId);
      toast('Cours supprimé.');
      renderAdminPdfLists();
    });
  });
}

function openUserModal(user){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Modifier ${escapeHtml(user.fullname)}</h3>
      <div class="field"><label>Nom complet</label><input id="um-fullname" value="${escapeHtml(user.fullname)}"></div>
      <div class="field"><label>Nom d'utilisateur</label><input id="um-username" value="${escapeHtml(user.username)}" disabled></div>
      <div class="field"><label>Téléphone</label><input id="um-phone" value="${escapeHtml(user.phone||'')}"></div>
      <div class="hint" style="margin-bottom:12px;">🔒 Pour des raisons de sécurité Firebase, un admin ne peut pas changer le mot de passe d'un autre compte depuis le navigateur — l'élève doit le faire lui-même depuis son Profil.</div>
      <div class="field"><label>Rôle</label>
        <div class="pill-select" id="um-role-pills">
          <button type="button" class="pill ${user.role==='student' ? 'active':''}" data-role-pill="student">🎓 Élève</button>
          <button type="button" class="pill ${user.role==='admin' ? 'active':''}" data-role-pill="admin">⚙ Administrateur</button>
        </div>
        <input type="hidden" id="um-role" value="${user.role==='admin' ? 'admin' : 'student'}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="um-cancel">Annuler</button>
        <button class="btn btn-primary" id="um-save">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('um-cancel').addEventListener('click', ()=>overlay.remove());
  overlay.querySelectorAll('[data-role-pill]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      overlay.querySelectorAll('[data-role-pill]').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('um-role').value = btn.dataset.rolePill;
    });
  });
  document.getElementById('um-save').addEventListener('click', async ()=>{
    const fullname = document.getElementById('um-fullname').value.trim();
    const phone = document.getElementById('um-phone').value.trim();
    const role = document.getElementById('um-role').value;
    user.fullname = fullname || user.fullname;
    user.phone = phone;
    user.role = role;
    await saveUser(user);
    toast('Compte mis à jour.');
    overlay.remove();
    render();
  });
}

/* ================= START ================= */
boot();
</script>
